server.port: 8082
spring:
  application.name: notificacao-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/notificacao_db}
    username: ${DB_USER:notificacao_user}
    password: ${DB_PASSWORD:${NOTIFICACAO_DB_PASSWORD:notificacao_password}}
  jpa.hibernate.ddl-auto: validate
  jpa.open-in-view: false
  flyway.enabled: true
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include: health,info,metrics,prometheus
management.tracing.sampling.probability: 1.0
management.zipkin.tracing.endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
management.otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.propagation.type: w3c
logging.pattern.console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level service=${spring.application.name} correlationId=%X{correlationId} traceparent=%X{traceparent} - %msg%n"
